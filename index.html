<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spanish Quest: SIELE Prep</title>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #58a700;
            --secondary: #1cb0f6;
            --secondary-dark: #1899d6;
            --bg: #ffffff;
            --text: #3c3c3c;
            --gray: #e5e5e5;
            --wrong: #ff4b4b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', 'Segoe UI', sans-serif; }
        
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Навигация */
        nav { display: flex; justify-content: space-around; padding: 15px; border-bottom: 2px solid var(--gray); position: sticky; top: 0; background: white; z-index: 100; }
        .stat { font-weight: bold; font-size: 1.1em; color: var(--secondary); }

        /* Экраны */
        .screen { display: none; padding: 20px; max-width: 600px; margin: 0 auto; min-height: 90vh; }
        .screen.active { display: block; }

        /* Карточка уровня (Dashboard) */
        .level-card { border: 2px solid var(--gray); border-radius: 15px; padding: 20px; margin-bottom: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
        .level-card:hover { border-color: var(--primary); background: #f7fff0; }
        .level-card.locked { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .level-title { font-size: 1.5em; font-weight: bold; margin-bottom: 10px; }

        /* Игровой интерфейс */
        .progress-container { width: 100%; height: 16px; background: var(--gray); border-radius: 8px; margin-bottom: 30px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
        
        .question-title { font-size: 1.6em; font-weight: bold; margin-bottom: 10px; }
        .question-hint { color: #777; margin-bottom: 30px; font-style: italic; }

        /* Варианты ответов */
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: white; border: 2px solid var(--gray); padding: 15px; font-size: 1.1em; border-radius: 12px; cursor: pointer; text-align: left; transition: 0.2s; font-weight: bold; color: var(--text); }
        .option-btn:hover { background: #f0f0f0; }
        .option-btn.correct { background: #d7ffb8; border-color: var(--primary); color: var(--primary-dark); }
        .option-btn.wrong { background: #ffdfe0; border-color: var(--wrong); color: var(--wrong); }

        /* Кнопка записи голоса */
        .mic-btn { background: var(--secondary); color: white; border: none; padding: 20px; border-radius: 50%; font-size: 2em; cursor: pointer; margin: 20px auto; display: block; width: 80px; height: 80px; box-shadow: 0 4px 0 var(--secondary-dark); }
        .mic-btn.recording { background: var(--wrong); box-shadow: 0 4px 0 #cc0000; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Нижняя панель обратной связи */
        .bottom-panel { position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px; background: white; border-top: 2px solid var(--gray); transform: translateY(100%); transition: 0.3s; display: flex; justify-content: space-between; align-items: center; z-index: 200; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); }
        .bottom-panel.visible { transform: translateY(0); }
        
        .action-btn { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 12px; font-size: 1.2em; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 var(--primary-dark); }
        .action-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
    </style>
</head>
<body>

<nav id="navbar">
    <div class="stat">🇪🇸 Español</div>
    <div class="stat">⚡ Опыт: <span id="xp-counter">0</span></div>
</nav>

<!-- ЭКРАН 1: Дашборд (Карта уровней) -->
<div id="dashboard-screen" class="screen active">
    <h2 style="margin-bottom: 20px; text-align: center;">Путь к SIELE</h2>
    <div id="levels-container"></div>
</div>

<!-- ЭКРАН 2: Игровой процесс -->
<div id="game-screen" class="screen">
    <div class="progress-container">
        <div class="progress-bar" id="game-progress"></div>
    </div>
    
    <div class="question-title" id="q-title">Вопрос</div>
    <div class="question-hint" id="q-hint">Подсказка</div>
    
    <div id="q-content">
        <!-- Сюда вставляются кнопки или микрофон -->
    </div>
</div>

<!-- Нижняя панель действий -->
<div class="bottom-panel" id="action-panel">
    <div id="feedback-text" style="font-size: 1.2em; font-weight: bold;"></div>
    <button class="action-btn" id="next-btn" onclick="handleNext()">Далее</button>
</div>

<script>
    // --- БАЗА ДАННЫХ ИГРЫ ---
    const courseData = [
        {
            id: "module_1",
            title: "A1: Основы",
            requiredXP: 0,
            questions: [
                { type: "choice", q: "Как сказать «Доброе утро»?", options: ["Buenas noches", "Buenos días", "Hola"], correct: 1 },
                { type: "speak", q: "Произнесите по-испански: «Спасибо»", textToMatch: "gracias", hint: "Нажмите на микрофон и скажите 'Gracias'" }
            ]
        },
        {
            id: "module_2",
            title: "A2: Прошедшее время",
            requiredXP: 20,
            questions: [
                { type: "choice", q: "Ayer yo _____ (видеть) una película.", options: ["veo", "veía", "vi"], correct: 2 },
                { type: "speak", q: "Произнесите: «Вчера я ел паэлью»", textToMatch: "ayer comí paella", hint: "Скажите 'Ayer comí paella'" }
            ]
        },
        // НОВЫЙ МОДУЛЬ: Аудирование
        {
            id: "module_3",
            title: "B1: Аудирование",
            requiredXP: 40,
            questions: [
                { 
                    type: "audio", 
                    q: "Послушайте звук. Что происходит на улице?", 
                    audioUrl: "https://actions.google.com/sounds/v1/water/rain_on_roof.ogg", // Тестовое аудио
                    options: ["Hace sol (Солнечно)", "Está lloviendo (Идет дождь)", "Nieva (Идет снег)"], 
                    correct: 1 
                }
            ]
        }
    ];

    // --- СОСТОЯНИЕ ИГРЫ ---
    let userXP = parseInt(localStorage.getItem('spanishQuestXP')) || 0;
    let currentModule = null;
    let currentQuestionIndex = 0;
    let isAnswered = false;

    // --- DOM Элементы ---
    const screens = {
        dashboard: document.getElementById('dashboard-screen'),
        game: document.getElementById('game-screen')
    };
    const ui = {
        xp: document.getElementById('xp-counter'),
        levels: document.getElementById('levels-container'),
        progress: document.getElementById('game-progress'),
        qTitle: document.getElementById('q-title'),
        qHint: document.getElementById('q-hint'),
        qContent: document.getElementById('q-content'),
        panel: document.getElementById('action-panel'),
        feedback: document.getElementById('feedback-text'),
        nextBtn: document.getElementById('next-btn'),
        navbar: document.getElementById('navbar')
    };

    // --- ИНИЦИАЛИЗАЦИЯ ---
    function initApp() {
        ui.xp.textContent = userXP;
        renderDashboard();
    }

    // --- НАВИГАЦИЯ ---
    function switchScreen(screenName) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[screenName].classList.add('active');
        if(screenName === 'game') ui.navbar.style.display = 'none';
        else ui.navbar.style.display = 'flex';
    }

    // --- ДАШБОРД ---
    function renderDashboard() {
        ui.levels.innerHTML = '';
        courseData.forEach((mod, index) => {
            const isLocked = userXP < mod.requiredXP;
            const card = document.createElement('div');
            card.className = `level-card ${isLocked ? 'locked' : ''}`;
            card.innerHTML = `
                <div class="level-title">${mod.title}</div>
                <div style="color: #777;">${isLocked ? `Нужно ${mod.requiredXP} XP` : 'Доступно'}</div>
            `;
            if (!isLocked) {
                card.onclick = () => startModule(mod);
            }
            ui.levels.appendChild(card);
        });
    }

    // --- ИГРОВОЙ ДВИЖОК ---
    function startModule(mod) {
        currentModule = mod;
        currentQuestionIndex = 0;
        switchScreen('game');
        loadQuestion();
    }

    function loadQuestion() {
        isAnswered = false;
        ui.panel.classList.remove('visible');
        ui.qContent.innerHTML = '';
        
        const q = currentModule.questions[currentQuestionIndex];
        const progress = (currentQuestionIndex / currentModule.questions.length) * 100;
        ui.progress.style.width = `${progress}%`;

        ui.qTitle.textContent = q.q;
        ui.qHint.textContent = q.hint || '';

        if (q.type === 'choice') {
            const grid = document.createElement('div');
            grid.className = 'options-grid';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkChoice(idx, btn, q.correct);
                grid.appendChild(btn);
            });
            ui.qContent.appendChild(grid);

        } else if (q.type === 'speak') {
            const btn = document.createElement('button');
            btn.className = 'mic-btn';
            btn.innerHTML = '🎤';
            btn.onclick = () => startSpeechRecognition(q.textToMatch, btn);
            ui.qContent.appendChild(btn);

        // НОВЫЙ БЛОК ДЛЯ АУДИО
        } else if (q.type === 'audio') {
            // Создаем плеер
            const audioEl = document.createElement('audio');
            audioEl.controls = true;
            audioEl.src = q.audioUrl;
            audioEl.style.width = '100%';
            audioEl.style.marginBottom = '20px';
            audioEl.style.borderRadius = '10px';
            ui.qContent.appendChild(audioEl);

            // Создаем кнопки с ответами под плеером
            const grid = document.createElement('div');
            grid.className = 'options-grid';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkChoice(idx, btn, q.correct);
                grid.appendChild(btn);
            });
            ui.qContent.appendChild(grid);
        }
    }

    // --- ПРОВЕРКА ОТВЕТОВ ---
    function checkChoice(selectedIdx, btnEl, correctIdx) {
        if (isAnswered) return;
        isAnswered = true;
        
        const buttons = ui.qContent.querySelectorAll('.option-btn');
        if (selectedIdx === correctIdx) {
            btnEl.classList.add('correct');
            showFeedback(true, "Отлично!");
        } else {
            btnEl.classList.add('wrong');
            buttons[correctIdx].classList.add('correct');
            showFeedback(false, "Ошибка. Правильный ответ подсвечен.");
        }
    }

    // --- РАСПОЗНАВАНИЕ ГОЛОСА ---
    function startSpeechRecognition(targetText, btnEl) {
        if (!('webkitSpeechRecognition' in window)) {
            alert("Ваш браузер не поддерживает распознавание голоса. Используйте Google Chrome.");
            return;
        }

        const recognition = new webkitSpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            btnEl.classList.add('recording');
        };

        recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript.toLowerCase().trim();
            btnEl.classList.remove('recording');
            isAnswered = true;
            
            // Простая проверка: содержит ли сказанное ключевые слова (убираем знаки препинания)
            const cleanSpoken = spokenText.replace(/[.,¡!¿?]/g, '');
            const cleanTarget = targetText.toLowerCase();

            if (cleanSpoken.includes(cleanTarget) || cleanTarget.includes(cleanSpoken)) {
                showFeedback(true, `Вы сказали: "${spokenText}". Превосходно!`);
            } else {
                showFeedback(false, `Вы сказали: "${spokenText}". Ожидалось: "${targetText}".`);
            }
        };

        recognition.onerror = (event) => {
            btnEl.classList.remove('recording');
            alert("Ошибка микрофона: " + event.error);
        };

        recognition.start();
    }

    // --- ОБРАТНАЯ СВЯЗЬ И ПРОГРЕСС ---
    function showFeedback(isCorrect, text) {
        ui.feedback.textContent = text;
        ui.feedback.style.color = isCorrect ? 'var(--primary-dark)' : 'var(--wrong)';
        ui.panel.classList.add('visible');
        if (isCorrect) {
            userXP += 10;
            localStorage.setItem('spanishQuestXP', userXP);
            ui.xp.textContent = userXP;
        }
    }

    function handleNext() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentModule.questions.length) {
            loadQuestion();
        } else {
            // Урок закончен
            ui.panel.classList.remove('visible');
            alert(`Урок завершен! Вы заработали опыт. Ваш текущий XP: ${userXP}`);
            renderDashboard();
            switchScreen('dashboard');
        }
    }

    // Запуск
    initApp();
</script>
</body>
</html>
