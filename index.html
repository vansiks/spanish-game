<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIELE Master B2: Профессиональный курс от A1 до B2</title>
    <style>
        :root {
            --primary: #58cc02;
            --primary-dark: #58a700;
            --secondary: #1cb0f6;
            --secondary-dark: #1899d6;
            --theory: #ce82ff;
            --theory-dark: #a559d6;
            --grammar: #ff9600;
            --grammar-dark: #cc7a00;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --gray: #e5e5e5;
            --wrong: #ff4b4b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 90px; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 2px solid var(--gray); position: sticky; top: 0; background: white; z-index: 100; font-weight: bold; font-size: 1.1em; }
        .xp-text { color: var(--grammar); font-weight: 800; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; border-top: 2px solid var(--gray); display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.03); }
        .nav-item { text-align: center; color: #95a5a6; cursor: pointer; font-size: 0.75em; font-weight: bold; width: 20%; padding: 5px 0; transition: 0.2s; }
        .nav-item.active { color: var(--secondary); }
        .nav-icon { font-size: 1.4em; display: block; margin-bottom: 3px; }

        .screen { display: none; padding: 20px; max-width: 650px; margin: 0 auto; }
        .screen.active { display: block; }
        .level-header { margin: 25px 0 12px; font-size: 1.25em; color: var(--text); text-align: left; border-left: 5px solid var(--secondary); padding-left: 10px; font-weight: 800; }
        
        .lesson-btn { width: 100%; background: var(--card-bg); border: 2px solid var(--gray); padding: 18px; margin-bottom: 12px; border-radius: 16px; font-size: 1em; font-weight: bold; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 0 var(--gray); transition: 0.1s; }
        .lesson-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        .lesson-btn.theory { border-color: var(--theory); box-shadow: 0 4px 0 var(--theory-dark); color: var(--theory-dark); }
        .lesson-btn.grammar { border-color: var(--grammar); box-shadow: 0 4px 0 var(--grammar-dark); color: var(--grammar-dark); }
        .lesson-btn.practice { border-color: var(--primary); box-shadow: 0 4px 0 var(--primary-dark); color: var(--primary-dark); }

        #lesson-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 200; flex-direction: column; }
        .lesson-header { padding: 20px; display: flex; align-items: center; gap: 15px; }
        .close-btn { background: none; border: none; font-size: 1.5em; color: #95a5a6; cursor: pointer; }
        .progress-bar-bg { flex: 1; height: 16px; background: var(--gray); border-radius: 8px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
        
        .lesson-body { flex: 1; padding: 20px; max-width: 650px; margin: 0 auto; width: 100%; overflow-y: auto; }
        .q-title { font-size: 1.35em; font-weight: bold; margin-bottom: 20px; line-height: 1.4; color: #2c3e50; }
        
        .flashcard { background: transparent; width: 100%; height: 260px; perspective: 1000px; margin-bottom: 20px; cursor: pointer; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 1.6em; font-weight: bold; border-radius: 16px; border: 2px solid var(--gray); padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .flashcard-front { background-color: white; color: var(--text); }
        .flashcard-back { background-color: var(--theory); color: white; transform: rotateY(180deg); border: none; }

        .text-input { width: 100%; padding: 15px; font-size: 1.2em; border: 2px solid var(--gray); border-radius: 12px; margin-bottom: 20px; outline: none; transition: 0.2s; }
        .text-input:focus { border-color: var(--secondary); background: #f0f9ff; }

        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: white; border: 2px solid var(--gray); padding: 16px; border-radius: 12px; font-size: 1.1em; font-weight: bold; cursor: pointer; text-align: left; transition: 0.1s; }
        .option-btn.selected { background: #ddf4ff; border-color: var(--secondary); }
        .option-btn.correct { background: #d7ffb8; border-color: var(--primary); color: var(--primary-dark); }
        .option-btn.wrong { background: #ffdfe0; border-color: var(--wrong); color: var(--wrong); }

        .mic-btn { display: block; margin: 30px auto; width: 85px; height: 85px; border-radius: 50%; background: var(--secondary); color: white; font-size: 2.2em; border: none; box-shadow: 0 4px 0 var(--secondary-dark); cursor: pointer; }
        .mic-btn.recording { background: var(--wrong); box-shadow: 0 4px 0 #cc0000; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .lesson-footer { padding: 20px; border-top: 2px solid var(--gray); display: flex; justify-content: space-between; align-items: center; background: white; }
        .lesson-footer.correct-bg { background: #d7ffb8; }
        .lesson-footer.wrong-bg { background: #ffdfe0; }
        .check-btn { background: var(--primary); color: white; border: none; padding: 15px 30px; font-size: 1.2em; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; box-shadow: 0 4px 0 var(--primary-dark); }
        .check-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        #feedback-msg { display: none; font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>

            { type: "write", q: "Напишите грандиозный финальный аккорд эссе: «В заключение хочется выразить уверенность в том, что совместными усилиями мы сможем построить гармоничное будущее»", match: "en conclusión quisiera expresar mi confianza en que con nuestros esfuerzos conjuntos lograremos construir un futuro armónico" }
        ]
    }
);


// ==========================================
// ЛОГИКА ИНТЕРФЕЙСА И РЕНДЕРИНГА ПРИЛОЖЕНИЯ
// ==========================================

let xp = parseInt(localStorage.getItem('sieleMasterXP')) || 0;
document.getElementById('xp-counter').textContent = xp;

let currentSection = '';
let currentLessonIdx = 0;
let currentTaskIdx = 0;
let currentTask = null;
let selectedOption = null;
let isAnswered = false;

const ui = {
    lessonScreen: document.getElementById('lesson-screen'),
    lessonBody: document.getElementById('lesson-body'),
    progress: document.getElementById('lesson-progress'),
    checkBtn: document.getElementById('check-btn'),
    footer: document.getElementById('lesson-footer'),
    feedback: document.getElementById('feedback-msg')
};

// Функция отрисовки всех секций и уроков на экранах
function renderAllSections() {
    ['theory', 'grammar', 'listening', 'speaking', 'writing'].forEach(sec => {
        const container = document.getElementById(`tab-${sec}`);
        if (!container) return;
        container.innerHTML = '';
        
        let currentLevel = '';
        if (!database[sec]) return;

        database[sec].forEach((lesson, idx) => {
            if (lesson.level !== currentLevel) {
                currentLevel = lesson.level;
                const header = document.createElement('div');
                header.className = 'level-header';
                header.textContent = currentLevel;
                container.appendChild(header);
            }
            const btn = document.createElement('button');
            
            let btnClass = 'practice';
            let icon = '📖';
            if (sec === 'theory') { btnClass = 'theory'; icon = '📚'; }
            if (sec === 'grammar') { btnClass = 'grammar'; icon = '⚙️'; }
            
            btn.className = `lesson-btn ${btnClass}`;
            btn.innerHTML = `<span>${icon} ${lesson.title}</span> <span>Начать</span>`;
            btn.onclick = () => startLesson(sec, idx);
            container.appendChild(btn);
        });
    });
}

function switchTab(tabId, el) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    el.classList.add('active');
}

function startLesson(section, lessonIdx) {
    currentSection = section;
    currentLessonIdx = lessonIdx;
    currentTaskIdx = 0;
    ui.lessonScreen.style.display = 'flex';
    loadTask();
}

function closeLesson() {
    ui.lessonScreen.style.display = 'none';
    resetFooter();
}

function loadTask() {
    resetFooter();
    isAnswered = false;
    selectedOption = null;
    
    const lesson = database[currentSection][currentLessonIdx];
    currentTask = lesson.tasks[currentTaskIdx];
    
    ui.progress.style.width = `${(currentTaskIdx / lesson.tasks.length) * 100}%`;
    ui.lessonBody.innerHTML = '';

    if (currentTask.type === 'flashcard') {
        ui.lessonBody.innerHTML = `
            <div class="q-title">Карточка правила (Изучите и переверните):</div>
            <div class="flashcard" onclick="this.classList.toggle('flipped'); checkFlashcard()">
                <div class="flashcard-inner">
                    <div class="flashcard-front">${currentTask.front}</div>
                    <div class="flashcard-back">${currentTask.back}</div>
                </div>
            </div>
            <div style="text-align: center; color: #777;">Нажмите на карточку для просмотра перевода</div>
        `;
        ui.checkBtn.textContent = "Продолжить";
        ui.checkBtn.disabled = true;
        ui.checkBtn.style.opacity = '0.5';

    } else if (currentTask.type === 'write') {
        ui.lessonBody.innerHTML = `
            <div class="q-title">${currentTask.q}</div>
            <input type="text" class="text-input" id="write-input" placeholder="Введите ответ по-испански..." autocomplete="off">
        `;
        ui.checkBtn.textContent = "Проверить";

    } else if (currentTask.type === 'choice') {
        let optionsHtml = currentTask.options.map((opt, i) => 
            `<button class="option-btn" onclick="selectOption(${i}, this)">${opt}</button>`
        ).join('');
        ui.lessonBody.innerHTML = `
            <div class="q-title">${currentTask.q}</div>
            <div class="options-grid">${optionsHtml}</div>
        `;
        ui.checkBtn.textContent = "Проверить";

    } else if (currentTask.type === 'audio') {
        let optionsHtml = currentTask.options.map((opt, i) => 
            `<button class="option-btn" onclick="selectOption(${i}, this)">${opt}</button>`
        ).join('');
        ui.lessonBody.innerHTML = `
            <div class="q-title">${currentTask.q}</div>
            <audio controls src="${currentTask.url}" style="width: 100%; margin-bottom: 20px;"></audio>
            <div class="options-grid">${optionsHtml}</div>
        `;
        ui.checkBtn.textContent = "Проверить";
        
    } else if (currentTask.type === 'speak') {
        ui.lessonBody.innerHTML = `
            <div class="q-title">${currentTask.q}</div>
            <button class="mic-btn" id="mic-btn" onclick="startMic()">🎤</button>
            <div style="text-align: center; color: #777;">Нажмите на микрофон и отчетливо произнесите фразу</div>
        `;
        ui.checkBtn.textContent = "Пропустить / Далее";
    }
}

function checkFlashcard() {
    ui.checkBtn.disabled = false;
    ui.checkBtn.style.opacity = '1';
}

function selectOption(idx, btn) {
    if (isAnswered) return;
    selectedOption = idx;
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
}

function checkAnswer() {
    if (isAnswered) {
        nextTask();
        return;
    }

    let isCorrect = false;

    if (currentTask.type === 'flashcard') {
        isCorrect = true;
    } 
    else if (currentTask.type === 'write') {
        const val = document.getElementById('write-input').value.toLowerCase().trim();
        if (!val) return;
        if (val === currentTask.match.toLowerCase()) isCorrect = true;
    }
    else if (currentTask.type === 'choice' || currentTask.type === 'audio') {
        if (selectedOption === null) return;
        if (selectedOption === currentTask.correct) isCorrect = true;
        
        const btns = document.querySelectorAll('.option-btn');
        btns[currentTask.correct].classList.add('correct');
        if (!isCorrect) btns[selectedOption].classList.add('wrong');
    }
    else if (currentTask.type === 'speak') {
        nextTask();
        return; 
    }

    isAnswered = true;
    showFeedback(isCorrect);
}

function showFeedback(isCorrect) {
    ui.feedback.style.display = 'block';
    if (isCorrect) {
        ui.footer.classList.add('correct-bg');
        ui.feedback.textContent = "Отлично! Задание выполнено верно.";
        ui.feedback.style.color = "var(--primary-dark)";
        xp += 10;
    } else {
        ui.footer.classList.add('wrong-bg');
        ui.feedback.textContent = "Ошибка. Правильный ответ: " + (currentTask.match || currentTask.options[currentTask.correct]);
        ui.feedback.style.color = "var(--wrong)";
    }
    ui.checkBtn.textContent = "Далее";
}

function resetFooter() {
    ui.footer.classList.remove('correct-bg', 'wrong-bg');
    ui.feedback.style.display = 'none';
    ui.checkBtn.disabled = false;
    ui.checkBtn.style.opacity = '1';
}

function nextTask() {
    currentTaskIdx++;
    const lesson = database[currentSection][currentLessonIdx];
    
    if (currentTaskIdx < lesson.tasks.length) {
        loadTask();
    } else {
        localStorage.setItem('sieleMasterXP', xp);
        document.getElementById('xp-counter').textContent = xp;
        alert(`Поздравляем! Модуль завершен. Ваш прогресс: ${xp} XP`);
        closeLesson();
        renderAllSections();
    }
}

function startMic() {
    const btn = document.getElementById('mic-btn');
    if (!('webkitSpeechRecognition' in window)) {
        alert("Распознавание речи поддерживается в браузерах Chrome / Edge.");
        return;
    }
    const recognition = new webkitSpeechRecognition();
    recognition.lang = 'es-ES';
    
    recognition.onstart = () => btn.classList.add('recording');
    recognition.onresult = (event) => {
        btn.classList.remove('recording');
        const spoken = event.results[0][0].transcript.toLowerCase().replace(/[.,¡!¿?]/g, '').trim();
        isAnswered = true;
        if (spoken.includes(currentTask.match) || currentTask.match.includes(spoken)) {
            showFeedback(true);
        } else {
            ui.feedback.style.display = 'block';
            ui.footer.classList.add('wrong-bg');
            ui.feedback.textContent = `Распознано: "${spoken}". Ожидалось: "${currentTask.match}"`;
            ui.feedback.style.color = "var(--wrong)";
            ui.checkBtn.textContent = "Далее";
        }
    };
    recognition.onerror = () => btn.classList.remove('recording');
    recognition.start();
}

// Первичная инициализация интерфейса и наполнения
renderAllSections();
</script>
